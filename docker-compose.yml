# Disposable Postgres + pgvector for the ignored contract tests.
#   docker compose up -d
#   TEST_DATABASE_URL=postgres://postgres:postgres@localhost:54329/retrieval \
#     cargo test -p engine-postgres -- --ignored --test-threads=1
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retrieval
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retrieval"]
      interval: 2s
      timeout: 3s
      retries: 30
